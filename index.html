        // Helper: format bytes
        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function setupDashboardEvents() {
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('file-input');

            dropzone.onclick = () => fileInput.click();
            fileInput.onchange = (e) => handleFiles(e.target.files);

            dropzone.ondragover = (e) => {
                e.preventDefault();
                dropzone.classList.add('border-cyber-500', 'bg-cyber-500/10');
            };
            dropzone.ondragleave = () => {
                dropzone.classList.remove('border-cyber-500', 'bg-cyber-500/10');
            };
            dropzone.ondrop = (e) => {
                e.preventDefault();
                dropzone.classList.remove('border-cyber-500', 'bg-cyber-500/10');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFiles(e.dataTransfer.files);
                }
            };

            document.getElementById('btn-clear-chat').onclick = handleClearChat;
            document.getElementById('chat-form').onsubmit = handleChatSubmit;

            document.querySelectorAll('.quick-prompt').forEach(btn => {
                btn.onclick = () => {
                    const input = document.getElementById('chat-input');
                    input.value = btn.innerText.trim();
                    input.focus();
                };
            });
        }

        function renderDocuments() {
            const container = document.getElementById('documents-container');
            const counter = document.getElementById('doc-counter');
            const statChunks = document.getElementById('stat-chunks');
            if (!container) return;

            counter.innerText = `${state.documents.length} Files`;
            let totalChunks = 0;
            state.documents.forEach(d => totalChunks += (d.chunk_count || 0));
            if (statChunks) statChunks.innerText = totalChunks;

            if (state.documents.length === 0) {
                container.innerHTML = `
                    <div class="h-44 flex flex-col items-center justify-center text-center p-4 rounded-xl border border-dashed border-obsidian-800 text-slate-500">
                        <svg class="w-8 h-8 text-slate-600 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                        </svg>
                        <p class="text-xs font-medium">Vault is currently empty</p>
                        <p class="text-[11px] font-mono mt-0.5">Upload a PDF or document above to begin indexing</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = state.documents.map(doc => `
                <div class="flex items-center justify-between p-3 rounded-xl bg-obsidian-950/70 border border-obsidian-800 hover:border-obsidian-700 transition-all group">
                    <div class="flex items-center gap-3 min-w-0 pr-2">
                        <div class="w-8 h-8 rounded-lg bg-cyber-500/10 text-cyber-400 border border-cyber-500/20 flex items-center justify-center shrink-0">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                        </div>
                        <div class="min-w-0">
                            <p class="text-xs font-semibold text-slate-200 truncate" title="${doc.filename}">${doc.filename}</p>
                            <p class="text-[10px] font-mono text-slate-500">
                                ${formatBytes(doc.file_size)} &bull; <span class="text-cyber-400">${doc.chunk_count || 0} chunks</span>
                            </p>
                        </div>
                    </div>
                    <button onclick="handleDeleteDocument('${doc.filename}')" title="Delete document" 
                            class="p-1.5 rounded-lg text-slate-500 hover:text-red-400 hover:bg-red-500/10 transition-all opacity-80 group-hover:opacity-100">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        function renderChatHistory() {
            const chatStream = document.getElementById('chat-stream');
            if (!chatStream) return;

            if (state.chatHistory.length === 0) {
                chatStream.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center p-8 text-slate-400">
                        <div class="w-14 h-14 rounded-2xl bg-cyber-500/10 border border-cyber-500/20 text-cyber-400 flex items-center justify-center mb-4 shadow-[0_0_20px_rgba(16,185,129,0.15)]">
                            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                            </svg>
                        </div>
                        <h3 class="text-base font-bold text-white mb-1">Welcome, ${state.user ? state.user.username : 'Analyst'}</h3>
                        <p class="text-xs text-slate-400 max-w-md leading-relaxed">
                            Your isolated, air-gapped document intelligence session is active. Ask questions about your uploaded documents or choose a suggested prompt below.
                        </p>
                    </div>
                `;
                return;
            }

            chatStream.innerHTML = state.chatHistory.map((item, index) => {
                if (item.role === 'user') {
                    return `
                        <div class="flex items-start justify-end gap-3">
                            <div class="max-w-xl p-4 rounded-2xl bg-gradient-to-r from-emerald-600/90 to-cyber-600/90 text-obsidian-950 font-medium text-sm shadow-md">
                                ${escapeHtml(item.message)}
                            </div>
                            <div class="w-8 h-8 rounded-lg bg-cyber-500/20 text-cyber-400 border border-cyber-500/30 flex items-center justify-center font-bold text-xs uppercase shrink-0">
                                ${state.user ? state.user.username.charAt(0) : 'U'}
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="flex items-start gap-3">
                            <div class="w-8 h-8 rounded-lg bg-obsidian-850 text-cyan-400 border border-cyan-500/30 flex items-center justify-center shrink-0">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                                </svg>
                            </div>
                            <div class="max-w-2xl space-y-2">
                                <div class="p-4 rounded-2xl bg-obsidian-900 border border-obsidian-800 text-slate-200 text-sm leading-relaxed shadow-md">
                                    ${formatBotReply(item.message)}
                                </div>
                                ${item.sources && item.sources.length > 0 ? `
                                    <details class="text-xs text-slate-400 bg-obsidian-950/70 border border-obsidian-800 rounded-xl p-2.5">
                                        <summary class="cursor-pointer font-mono text-[11px] text-cyber-400 hover:text-cyber-300 font-semibold select-none flex items-center gap-1.5">
                                            <span>&#9656; Verified Retrieved Sources (${item.sources.length})</span>
                                            ${item.latency ? `<span class="text-slate-500 ml-auto font-mono text-[10px]">Latency: ${item.latency}</span>` : ''}
                                        </summary>
                                        <div class="mt-2.5 space-y-2 border-t border-obsidian-800 pt-2 font-mono text-[11px]">
                                            ${item.sources.map((s, si) => `
                                                <div class="p-2 rounded bg-obsidian-900/80 border border-obsidian-850">
                                                    <span class="text-cyan-400 font-semibold">[#${si+1}] ${escapeHtml(s.source)}</span>
                                                    <p class="text-slate-400 mt-1 italic text-[10px] leading-relaxed">"${escapeHtml(s.snippet)}"</p>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </details>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }
            }).join('');

            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatBotReply(text) {
            if (!text) return '';
            let html = escapeHtml(text);
            // Newlines to breaks
            html = html.replace(/\n\n/g, '</p><p class="mt-2">').replace(/\n/g, '<br>');
            return `<p>${html}</p>`;
        }

        // --- API INTERACTIONS ---
        async function checkSession() {
            try {
                const res = await fetch('/api/check_session');
                const data = await res.json();
                state.isLoggedIn = data.logged_in;
                state.user = data.user || null;
                renderNav();
                if (state.isLoggedIn) {
                    renderDashboardView();
                    await fetchDocuments();
                    await fetchChatHistory();
                } else {
                    renderAuthView();
                }
            } catch (err) {
                console.error("Session check error:", err);
                renderAuthView();
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const alertBox = document.getElementById('auth-alert');
            const submitBtn = document.getElementById('btn-auth-submit');

            const payload = {
                email: form.email.value.trim(),
                password: form.password.value.trim()
            };
            if (state.authMode === 'register') {
                payload.username = form.username.value.trim();
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Processing...</span>`;

            try {
                const endpoint = state.authMode === 'register' ? '/api/register' : '/api/login';
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (!res.ok) {
                    alertBox.className = "mb-4 p-3 rounded-lg text-xs bg-red-500/20 text-red-300 border border-red-500/30 font-mono";
                    alertBox.innerText = data.message || "Authentication failed.";
                    alertBox.classList.remove('hidden');
                    return;
                }

                await checkSession();
            } catch (err) {
                alertBox.className = "mb-4 p-3 rounded-lg text-xs bg-red-500/20 text-red-300 border border-red-500/30 font-mono";
                alertBox.innerText = "Network error communicating with local server.";
                alertBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>${state.authMode === 'login' ? 'Unlock Secure Workspace' : 'Create Encrypted Vault'}</span>`;
            }
        }

        async function handleLogout() {
            await fetch('/api/logout', { method: 'POST' });
            state.isLoggedIn = false;
            state.user = null;
            state.documents = [];
            state.chatHistory = [];
            renderNav();
            renderAuthView();
        }

        async function fetchDocuments() {
            try {
                const res = await fetch('/api/documents');
                if (res.ok) {
                    const data = await res.json();
                    state.documents = data.documents || [];
                    renderDocuments();
                }
            } catch (e) {
                console.error("Failed fetching documents", e);
            }
        }

        async function fetchChatHistory() {
            try {
                const res = await fetch('/api/chat/history');
                if (res.ok) {
                    const data = await res.json();
                    state.chatHistory = data.history || [];
                    renderChatHistory();
                }
            } catch (e) {
                console.error("Failed fetching chat history", e);
            }
        }

        async function handleFiles(files) {
            if (!files || files.length === 0) return;
            const statusBox = document.getElementById('upload-status');
            statusBox.className = "mt-3 p-2.5 rounded-lg text-xs font-mono bg-cyber-500/10 text-cyber-400 border border-cyber-500/20";
            statusBox.innerHTML = `<span class="animate-pulse">&#9679;</span> Ingesting and vectorizing ${files.length} file(s)...`;
            statusBox.classList.remove('hidden');

            const formData = new FormData();
            for (let f of files) {
                formData.append('files', f);
            }

            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message);

                statusBox.className = "mt-3 p-2.5 rounded-lg text-xs font-mono bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                statusBox.innerText = data.message;
                await fetchDocuments();
                setTimeout(() => statusBox.classList.add('hidden'), 4000);
            } catch (err) {
                statusBox.className = "mt-3 p-2.5 rounded-lg text-xs font-mono bg-red-500/20 text-red-300 border border-red-500/30";
                statusBox.innerText = "Upload failed: " + err.message;
            }
        }

        async function handleDeleteDocument(filename) {
            if (!confirm(`Are you sure you want to permanently delete "${filename}" from your private vault?`)) return;
            try {
                const res = await fetch(`/api/delete/${encodeURIComponent(filename)}`, { method: 'DELETE' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message);
                await fetchDocuments();
            } catch (err) {
                alert("Error deleting file: " + err.message);
            }
        }

        async function handleClearChat() {
            if (state.chatHistory.length === 0) return;
            if (!confirm("Clear this conversation history?")) return;
            try {
                await fetch('/api/chat/history', { method: 'DELETE' });
                state.chatHistory = [];
                renderChatHistory();
            } catch (err) {
                console.error("Error clearing chat", err);
            }
        }

        async function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message || state.isProcessingQuery) return;

            // Append user message immediately
            state.chatHistory.push({ role: 'user', message });
            renderChatHistory();
            input.value = '';

            // Append thinking placeholder
            const chatStream = document.getElementById('chat-stream');
            const thinkingId = 'thinking-' + Date.now();
            chatStream.insertAdjacentHTML('beforeend', `
                <div id="${thinkingId}" class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-lg bg-obsidian-850 text-cyber-400 border border-cyber-500/30 flex items-center justify-center shrink-0">
                        <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                    </div>
                    <div class="p-3.5 rounded-2xl bg-obsidian-900 border border-obsidian-800 text-slate-400 text-xs font-mono flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-cyber-400 animate-ping"></span>
                        Retrieving relevant chunks & executing local LLM inference...
                    </div>
                </div>
            `);
            chatStream.scrollTop = chatStream.scrollHeight;
            state.isProcessingQuery = true;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                
                const thinkingElem = document.getElementById(thinkingId);
                if (thinkingElem) thinkingElem.remove();

                state.chatHistory.push({
                    role: 'assistant',
                    message: data.reply,
                    sources: data.sources || [],
                    latency: data.latency || null
                });
                renderChatHistory();

            } catch (err) {
                const thinkingElem = document.getElementById(thinkingId);
                if (thinkingElem) thinkingElem.remove();

                state.chatHistory.push({
                    role: 'assistant',
                    message: "Error processing query: " + err.message,
                    sources: []
                });
                renderChatHistory();
            } finally {
                state.isProcessingQuery = false;
            }
        }

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', checkSession);
    </script>
</body>
</html>
